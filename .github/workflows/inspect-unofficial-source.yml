name: Inspect unofficial redline source
on:
  push:
    branches: [unofficial-redline]
    paths: [.github/workflows/inspect-unofficial-source.yml]
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/unofficial-redline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unofficial-redline
      - name: Extract readable source parts
        shell: python
        run: |
          import re
          from pathlib import Path
          text = Path('app.html').read_text(encoding='utf-8')
          text = re.sub(r'[A-Za-z0-9+/=]{300,}', '<BASE64 OMITTED FOR INSPECTION>', text)
          folder = Path('tools/unofficial-inspection')
          folder.mkdir(parents=True, exist_ok=True)
          for old in folder.glob('part-*.txt'):
              old.unlink()
          lines = text.splitlines(keepends=True)
          parts, current = [], ''
          for line in lines:
              if len(current) + len(line) > 10000 and current:
                  parts.append(current)
                  current = ''
              current += line
          if current:
              parts.append(current)
          for i, part in enumerate(parts, 1):
              (folder / ('part-%02d.txt' % i)).write_text(part, encoding='utf-8')
      - name: Commit inspection copies on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/unofficial-inspection
          git diff --cached --quiet && exit 0
          git commit -m 'Generate readable app source for unofficial redline review'
          git push origin HEAD:unofficial-redline
